name: build current source line

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen version metadata
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python -c "import json, jsonschema; schema=json.load(open('versions/versions.schema.json')); catalog=json.load(open('versions/versions.json')); jsonschema.Draft202012Validator.check_schema(schema); jsonschema.validate(catalog, schema)"
          python scripts/validate-version-catalog.py
          python scripts/generate-version-catalog.py --check
          python scripts/test-banner-contract.py
          python scripts/select-version-builds.py --versions implemented
          if python scripts/select-version-builds.py --versions 1.21.11; then
            echo 'Unimplemented source line was incorrectly selected' >&2
            exit 1
          fi

  build-26-2:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply patches and build
        run: ./gradlew applyAllPatches build --stacktrace
      - name: Upload CI-only build output
        uses: actions/upload-artifact@v4
        with:
          name: victus-engine-26.2-${{ github.sha }}
          path: victus-server/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

# 26.2 is the only implemented source line. This workflow creates a short-lived
# CI artifact only; it intentionally has no deploy or release side effects.
