# === Victus Engine build properties ===

group = cloud.victus
version = 0.1.0-SNAPSHOT

# --- Upstream base: Paper 26.2 (unobfuscated). Update paperCommit to re-base on newer Paper. ---
mcVersion = 26.2
apiVersion = 26.2
# Paper commit this fork is based on (26.2 HEAD; verified via `git ls-remote PaperMC/Paper HEAD`,
# matches PurpurMC/Purpur ver/26.2 paperCommit).
paperCommit = 75c0b485bf038c175d6f3e6efc67519cd5cd524d

# --- Gradle daemon ---
# Temp is redirected to E: by scripts/dev-env.sh (dev machine C: is full). Do NOT set java.io.tmpdir
# here — set it in the environment instead.
org.gradle.jvmargs = -Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.vfs.watch = false
