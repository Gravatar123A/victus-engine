# === Victus Engine build properties ===

group = cloud.victus
version = 0.1.0-SNAPSHOT

# --- Upstream base ---
# Paper base to fork. 26.1 is the first UNOBFUSCATED Java Edition release (post-1.21.11),
# which is why we target it: no obfuscation mappings to maintain across updates.
# TODO(verify): pin to a concrete Paper commit/tag once building online.
mcVersion = 26.1
paperRef  = ver/26.1

# --- Gradle daemon ---
# Keep memory modest; the dev machine C: drive is full, temp is redirected to E: via
# scripts/dev-env.sh. Do NOT put -Djava.io.tmpdir here (set it in the env instead).
org.gradle.jvmargs = -Xmx3G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

# --- paperweight ---
paperweight.experimental.sharedCaches = false
